---
- name: Mettre à jour apt
  apt:
    update_cache: yes
  become: yes

- name: Installer Docker
  apt:
    name:
      - docker.io
      - docker-compose
    state: present
  become: yes

- name: Démarrer et activer Docker
  systemd:
    name: docker
    state: started
    enabled: yes
  become: yes

- name: Ajouter ubuntu au groupe docker
  user:
    name: ubuntu
    groups: docker
    append: yes
  become: yes

- name: Arrêter le conteneur existant
  shell: docker stop todoapp-backend || true
  ignore_errors: yes

- name: Supprimer le conteneur existant
  shell: docker rm todoapp-backend || true
  ignore_errors: yes

- name: Pulled la dernière image Docker
  shell: docker pull {{ docker_image }}
  become: yes

- name: Lancer le conteneur Spring Boot
  shell: |
    docker run -d \
      --name todoapp-backend \
      --restart always \
      -p {{ app_port }}:{{ app_port }} \
      -e DB_HOST={{ db_host }} \
      -e DB_PORT={{ db_port }} \
      -e DB_NAME={{ db_name }} \
      -e DB_USER={{ db_user }} \
      -e DB_PASSWORD={{ db_password }} \
      -e JWT_SECRET={{ jwt_secret }} \
      {{ docker_image }}
  become: yes

- name: Vérifier que le conteneur tourne
  shell: docker ps | grep todoapp-backend
  register: container_status
  become: yes

- name: Afficher le statut
  debug:
    msg: "{{ container_status.stdout }}"
