version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: todoapp-db
    environment:
      POSTGRES_DB: todoapp
      POSTGRES_USER: todouser
      POSTGRES_PASSWORD: todopass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todouser -d todoapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todoapp-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: todoapp
      DB_USER: todouser
      DB_PASSWORD: todopass
      JWT_SECRET: c2VjcmV0LWtleS1mb3ItdG9kby1hcHAtandrLWF0LWxlYXN0LTI1Ni1iaXRz
      JWT_EXPIRATION: 86400000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todoapp-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
